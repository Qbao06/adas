[platformio]
default_envs = gateway
src_dir = .

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
build_src_filter = +<esp32_ld2420_espnow.ino>

[env:gateway]
build_flags = ${env.build_flags} -D DEVICE_ROLE=ROLE_GATEWAY

[env:remote]
build_flags = ${env.build_flags} -D DEVICE_ROLE=ROLE_REMOTE
